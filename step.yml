title: |-
  STS Token
summary: |
  It generates sts toekn
description: |
  This step generates a sts token to request the automation infra back-end APIs
website: https://github.com/deliveryhero/pd-bitrise-step-sts-token
source_code_url: https://github.com/deliveryhero/pd-bitrise-step-sts-token
support_url: https://github.com/deliveryhero/pd-bitrise-step-sts-token

type_tags:
  - test

toolkit:
  bash:
    entry_file: step.sh

inputs:
  - STS_TA_KEY_ID:
      opts:
        title: "STS Key ID"
        description: "The Key ID for STS authentication"
        is_required: true

  - STS_TA_CLIENT_ID:
      opts:
        title: "STS Client ID"
        description: "The Client ID for STS authentication"
        is_required: true

  - STS_TA_PRIVATE_KEY:
      opts:
        title: "STS Private Key"
        description: "The Private Key for signing the JWT"
        is_required: true
        is_sensitive: true

  - STS_ISSUER:
      opts:
        title: "STS Issuer"
        description: "The STS Issuer URL"
        is_required: true

